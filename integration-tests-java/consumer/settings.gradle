pluginManagement {
    repositories {
        maven { url = uri(providers.gradleProperty('simpledslTestRepo').get()) }
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'io.github.qigao.simpledsl.settings' version '@SIMPLEDSL_VERSION@'
}

rootProject.name = 'simpledsl-consumer'

dependencyResolutionManagement {
    repositories {
        mavenCentral()
    }
}
