name: Bootstrap SimpleDSL Build

on:
  push:
    branches:
      - 'design/durex-gradle-plugin-distribution'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Verify project skeleton
        run: ./gradlew projects verifyProductNamespace --stacktrace
      - name: Verify bootstrap contract
        run: ./gradlew :simpledsl-build-bootstrap:test --stacktrace
      - name: Verify wrapper
        run: ./gradlew --version
