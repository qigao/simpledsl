name: Bootstrap SimpleDSL Build

on:
  push:
    branches:
      - 'design/durex-gradle-plugin-distribution'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Extract reusable bootstrap source
        if: github.event_name == 'push' && hashFiles('simpledsl-build-bootstrap/src/main/groovy/io/github/qigao/simpledsl/gradle/manifest/DependencyManifestLoader.groovy') == ''
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/qigao/durex.git /tmp/durex-source
          bash scripts/extract-bootstrap-from-durex.sh /tmp/durex-source
          git add -- simpledsl-build-bootstrap/src/main/groovy
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: migrate SimpleDSL bootstrap sources'
          git push origin HEAD:${{ github.ref_name }}
      - name: Verify project skeleton
        run: ./gradlew projects verifyProductNamespace --stacktrace
      - name: Verify bootstrap contract
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :simpledsl-build-bootstrap:test --stacktrace || status=$?
          if [[ ${status:-0} -ne 0 ]]; then
            echo '=== bootstrap test XML ==='
            find simpledsl-build-bootstrap/build/test-results/test -name 'TEST-*.xml' -print -exec cat {} \; || true
            exit "$status"
          fi
      - name: Verify build logic contract
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :simpledsl-build-logic:test --stacktrace || status=$?
          if [[ ${status:-0} -ne 0 ]]; then
            echo '=== build logic test XML ==='
            find simpledsl-build-logic/build/test-results/test -name 'TEST-*.xml' -print -exec cat {} \; || true
            exit "$status"
          fi
      - name: Verify wrapper
        run: ./gradlew --version
