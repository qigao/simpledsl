name: Bootstrap SimpleDSL Build

on:
  push:
    branches:
      - 'design/durex-gradle-plugin-distribution'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Verify project skeleton
        run: gradle projects verifyProductNamespace --stacktrace
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 9.1.0 --distribution-type bin
      - name: Verify wrapper
        run: ./gradlew --version
      - uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper-9.1.0
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.jar
            gradle/wrapper/gradle-wrapper.properties
