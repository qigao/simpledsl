name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: simpledsl-plugin-portal-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          test -n "$VERSION"
          if [[ "$VERSION" == *SNAPSHOT* ]]; then
            echo 'Plugin Portal releases must not use SNAPSHOT versions.' >&2
            exit 1
          fi
          echo "SIMPLEDSL_RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Clean workspace
        run: gradle clean --stacktrace

      - name: Verify plugin build
        shell: bash
        run: |
          set -euo pipefail
          gradle \
            verifyProductNamespace \
            :simpledsl-build-bootstrap:check \
            :simpledsl-build-logic:check \
            -PreleaseVersion="$SIMPLEDSL_RELEASE_VERSION" \
            --stacktrace

      - name: Verify published consumer contract
        shell: bash
        run: |
          set -euo pipefail
          gradle \
            publishToTestPluginRepository \
            :integration-tests:test \
            -PreleaseVersion="$SIMPLEDSL_RELEASE_VERSION" \
            --stacktrace

      - name: Validate Plugin Portal publications
        shell: bash
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: |
          set -euo pipefail
          test -n "$GRADLE_PUBLISH_KEY"
          test -n "$GRADLE_PUBLISH_SECRET"
          gradle \
            :simpledsl-build-bootstrap:publishPlugins \
            :simpledsl-build-logic:publishPlugins \
            -PreleaseVersion="$SIMPLEDSL_RELEASE_VERSION" \
            --validate-only \
            --stacktrace

      - name: Publish to Gradle Plugin Portal
        shell: bash
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: |
          set -euo pipefail
          test -n "$GRADLE_PUBLISH_KEY"
          test -n "$GRADLE_PUBLISH_SECRET"
          gradle \
            :simpledsl-build-bootstrap:publishPlugins \
            :simpledsl-build-logic:publishPlugins \
            -PreleaseVersion="$SIMPLEDSL_RELEASE_VERSION" \
            --stacktrace
