name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          test -n "$VERSION"
          echo "SIMPLEDSL_RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Verify Android SDK baseline
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

      - name: Verify release distribution
        shell: bash
        run: |
          set -euo pipefail
          gradle clean \
            verifyProductNamespace \
            :simpledsl-core:check \
            :simpledsl-java:check \
            :simpledsl-android:check \
            publishToTestPluginRepository \
            verifyBackendIsolation \
            :integration-tests-java:test \
            :integration-tests-android:test \
            -PreleaseVersion="$SIMPLEDSL_RELEASE_VERSION" \
            --stacktrace

      - name: Publish SimpleDSL plugins
        shell: bash
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: |
          set -euo pipefail
          test -n "$GRADLE_PUBLISH_KEY"
          test -n "$GRADLE_PUBLISH_SECRET"
          gradle \
            :simpledsl-core:publishPlugins \
            :simpledsl-java:publishPlugins \
            :simpledsl-android:publishPlugins \
            -PreleaseVersion="$SIMPLEDSL_RELEASE_VERSION" \
            --stacktrace
