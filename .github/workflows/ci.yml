name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Clean workspace
        run: gradle clean --stacktrace

      - name: Verify plugin build
        shell: bash
        run: |
          set -euo pipefail
          gradle \
            verifyProductNamespace \
            :simpledsl-core:check \
            :simpledsl-java:check \
            :simpledsl-android:check \
            --stacktrace

      - name: Collect Android TestKit diagnostics
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import re
          import xml.etree.ElementTree as ET

          needles = re.compile(
              r'(What went wrong|Problem:|Caused by:|Could not|Plugin|SDK|simpledsl|android|unable to resolve|No signature|Exception|Error)',
              re.IGNORECASE,
          )
          out = []
          for path in glob.glob('simpledsl-android/build/test-results/test/TEST-*.xml'):
              root = ET.parse(path).getroot()
              for case in root.findall('testcase'):
                  failure = case.find('failure')
                  if failure is None:
                      continue
                  out.append(f"=== {case.get('classname')}.{case.get('name')} ===")
                  text = failure.text or failure.get('message') or ''
                  lines = [line for line in text.splitlines() if needles.search(line)]
                  out.extend(lines[-120:])
                  break
              if out:
                  break
          if not out:
              out.append('No Android TestKit failure XML was found.')
          text = '\n'.join(out) + '\n'
          print(text)
          with open('android-testkit-diagnostics.txt', 'w', encoding='utf-8') as fh:
              fh.write(text)
          PY

      - name: Upload Android TestKit diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-testkit-diagnostics
          path: android-testkit-diagnostics.txt
          if-no-files-found: error

      - name: Verify published Java consumer contract
        shell: bash
        run: |
          set -euo pipefail
          gradle \
            publishToTestPluginRepository \
            verifyBackendIsolation \
            :integration-tests-java:test \
            --stacktrace

      - name: Verify wrapper metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'gradle-9.1.0-bin.zip' gradle/wrapper/gradle-wrapper.properties
          test -s gradle/wrapper/gradle-wrapper.jar
