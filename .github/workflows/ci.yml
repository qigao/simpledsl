name: CI

on:
  push:
    branches:
      - master
      - design/durex-gradle-plugin-distribution
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Clean workspace
        run: gradle clean --stacktrace

      - name: Verify plugin build
        shell: bash
        run: |
          set -euo pipefail
          gradle \
            verifyProductNamespace \
            :simpledsl-build-bootstrap:check \
            :simpledsl-build-logic:check \
            --stacktrace

      - name: Verify published consumer contract
        shell: bash
        run: |
          set -euo pipefail
          gradle \
            publishToTestPluginRepository \
            :integration-tests:test \
            --stacktrace

      - name: Validate Plugin Portal publications
        id: portal_validation
        if: github.event_name != 'pull_request'
        continue-on-error: true
        shell: bash
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: |
          set -euo pipefail
          test -n "$GRADLE_PUBLISH_KEY"
          test -n "$GRADLE_PUBLISH_SECRET"
          gradle \
            :simpledsl-build-bootstrap:publishPlugins \
            :simpledsl-build-logic:publishPlugins \
            -PreleaseVersion=0.1.0 \
            --validate-only \
            --stacktrace

      - name: Report development Portal validation status
        if: always() && github.event_name == 'push' && github.ref_name == 'design/durex-gradle-plugin-distribution'
        uses: actions/github-script@v7
        with:
          script: |
            const state = '${{ steps.portal_validation.outcome }}' === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'simpledsl/plugin-portal-validation',
              description: state === 'success'
                ? 'Plugin Portal validation passed'
                : 'Plugin Portal validation failed'
            });

      - name: Enforce Plugin Portal validation
        if: github.event_name != 'pull_request' && steps.portal_validation.outcome != 'success'
        run: exit 1

      - name: Verify wrapper metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'gradle-9.1.0-bin.zip' gradle/wrapper/gradle-wrapper.properties
          test -s gradle/wrapper/gradle-wrapper.jar
