name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Clean workspace
        run: gradle clean --stacktrace

      - name: Verify plugin build
        shell: bash
        run: |
          set -euo pipefail
          gradle \
            verifyProductNamespace \
            :simpledsl-core:check \
            :simpledsl-java:check \
            :simpledsl-android:check \
            --stacktrace

      - name: Print Android TestKit diagnostics
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          for path in glob.glob('simpledsl-android/build/test-results/test/TEST-*.xml'):
              root = ET.parse(path).getroot()
              for case in root.findall('testcase'):
                  failure = case.find('failure')
                  if failure is None:
                      continue
                  print(f"=== {case.get('classname')}.{case.get('name')} ===")
                  text = failure.text or failure.get('message') or ''
                  print(text[-12000:])
          PY

      - name: Verify published Java consumer contract
        shell: bash
        run: |
          set -euo pipefail
          gradle \
            publishToTestPluginRepository \
            verifyBackendIsolation \
            :integration-tests-java:test \
            --stacktrace

      - name: Verify wrapper metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'gradle-9.1.0-bin.zip' gradle/wrapper/gradle-wrapper.properties
          test -s gradle/wrapper/gradle-wrapper.jar
